service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 192.168.49.200

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

log:
  level: INFO

accessLog:
  enabled: true
  format: json
