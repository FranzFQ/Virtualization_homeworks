apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-fjqd

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-cluster-metrics
    files:
      - cluster-metrics.json
  - name: dashboard-app-logs
    files:
      - app-logs.json