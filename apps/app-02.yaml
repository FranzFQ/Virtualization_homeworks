apiVersion: v1
kind: ConfigMap
metadata:
  name: app2-html
  namespace: parcial-fjqd
data:
  index.html: |
    <html>
      <body style="background:#43a047;color:white;font-family:sans-serif;text-align:center;padding-top:15%">
        <h1>APP 2 - parcial-fjqd</h1>
        <p>Nginx + ConfigMap | app2.fjqd.local</p>
        <p>Servida a traves de Traefik + MetalLB</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: parcial-fjqd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app2-html
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: parcial-fjqd
spec:
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80