apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4
  namespace: parcial-fjqd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4
  template:
    metadata:
      labels:
        app: app4
    spec:
      containers:
        - name: web
          image: httpd:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app4
  namespace: parcial-fjqd
spec:
  selector:
    app: app4
  ports:
    - port: 80
      targetPort: 80