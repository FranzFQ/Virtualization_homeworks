apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: parcial-fjqd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app1.fjqd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app1, port: { number: 80 } }
    - host: app2.fjqd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app2, port: { number: 80 } }
    - host: app3.fjqd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app3, port: { number: 80 } }
    - host: app4.fjqd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: app4, port: { number: 80 } }